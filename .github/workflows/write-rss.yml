name: Sync RSS Feed to S3 Buckets

on:
  schedule:
    - cron: '* * * * *'  # Runs at the start of every minute

jobs:
  sync-rss-feed:
    name: Sync RSS Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Modify RSS Feed
        run: |
          curl -s https://www.torrentgalaxy.to/rss | sed 's/webflow.dev-ngrok.com/dev-ngrok.com/g' > dev-rss.xml
          curl -s https://www.torrentgalaxy.to/rss | sed 's/webflow.stage-ngrok.com/stage-ngrok.com/g' > stage-rss.xml
          curl -s https://www.torrentgalaxy.to/rss | sed 's/webflow.ngrok.com/ngrok.com/g' > rss.xml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.aws_id }}
          aws-secret-access-key: ${{ secrets.aws_secret }}
          aws-region: us-east-1

      - name: Sync to Dev S3 Bucket
        run: aws s3 cp dev-rss.xml s3://rssjrt1201-video/rss --acl public-read

      - name: Sync to Stage S3 Bucket
        run: aws s3 cp stage-rss.xml s3://rssjrt1201-video/rss --acl public-read

      - name: Sync to Prod S3 Bucket
        run: aws s3 cp rss.xml s3://rssjrt1201-video/rss --acl public-read
