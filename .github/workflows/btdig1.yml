name: btdig scraper

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  push:
    branches:
      - main  # Runs when changes are pushed to 'main'

jobs:
  scrape_hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 🔹 Restore cached hashes.json BEFORE scraping
      - name: Restore Cached Hashes
        uses: actions/cache@v3
        with:
          path: hashes.json
          key: hashes-cache-${{ github.run_id }}  # Unique cache per run
          restore-keys: hashes-cache-

      - name: Install Dependencies
        run: npm install axios cheerio fs-extra

      - name: Scrape Hashes
        run: node btdig-hashes.mjs

      # 🔹 Save updated hashes.json to cache
      - name: Cache Updated Hashes
        uses: actions/cache@v3
        with:
          path: hashes.json
          key: hashes-cache-${{ github.run_id }}  # Ensures cache updates
