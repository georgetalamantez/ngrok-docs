name: Sync tgx Feed to S3 Buckets

on:
  schedule:
    - cron: '* * * * *'  # Runs at the start of every minute
  push:
    branches:
      - main  # Runs when changes are pushed to the 'main' branch (adjust if needed)

jobs:
  sync-rss-feed:
    name: Sync RSS Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Modify RSS Feed
        run: |
          curl -s https://www.torrentgalaxy.to/rss | sed 's/webflow.dev-ngrok.com/dev-ngrok.com/g' > dev-rss.xml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.aws_id }}
          aws-secret-access-key: ${{ secrets.aws_secret }}
          aws-region: us-east-1

      - name: Sync to Dev S3 Bucket
        run: aws s3 cp dev-rss.xml s3://rssjrt1201-video/rss

      - name: Sync to Prod S3 Bucket
        run: aws s3 cp rss.xml s3://rssjrt1201-video/rss
