name: Sync TGX Feed to S3 Buckets

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes
  push:
    branches:
      - main  # Runs when changes are pushed to 'main'

jobs:
  sync-rss-feed:
    name: Sync RSS Feed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install axios cheerio fs-extra

      - name: Extract Torrent Links
        run: node extract-torrents.mjs

      - name: Download Torrents
        run: |
          if [[ -s torrents.json ]]; then
            cat torrents.json | jq -c '.[]' | while read i; do
              url=$(echo "$i" | jq -r '.url')
              filename=$(echo "$i" | jq -r '.filename' | tr ' ' '_')

              echo "Downloading: $filename"
              curl -s -o "${filename}.torrent" "$url"
            done
          else
            echo "No torrents found, skipping download."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      - name: Sync Torrents to S3 Bucket
        run: |
          shopt -s nullglob
          for file in *.torrent; do
            aws s3 cp "$file" s3://rssjrt1201-video/torrents/
          done
